<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hisaab - shop ledger</title>
<meta name="description" content="Hisaab: a simple khata ledger for small shops. Track credit, payments and send WhatsApp reminders.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1d2b2a;--mute:#5d6b69;--line:#d9d3c4;--green:#1f6f5c;--red:#b3361f;--blue:#2b4a7a}
@media (prefers-color-scheme:dark){:root{--bg:#161c1b;--card:#1f2726;--ink:#eef1ef;--mute:#9aa9a6;--line:#35413f;--green:#4cc2a3;--red:#ff8a73;--blue:#8fb2ec}}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif;padding:12px;max-width:640px;margin:0 auto}
h1,h2{margin:0 0 8px;font-weight:700}
h1{font-size:26px}h2{font-size:19px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0}
.total{font-size:34px;font-weight:700;color:var(--red)}
label{display:block;margin:8px 0 2px;color:var(--mute);font-size:14px}
input,select,textarea{width:100%;min-height:44px;font:16px inherit;font-family:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:90px;font-family:monospace}
button,a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border:0;border-radius:6px;background:var(--green);color:#fff;font:600 16px inherit;font-family:inherit;text-decoration:none;cursor:pointer;margin:8px 8px 0 0}
button.alt{background:transparent;color:var(--blue);border:1px solid var(--line)}
a.wa{background:#1a8d4a}
button.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
button:focus-visible,a.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button[disabled]{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;font-size:13px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mute);margin-left:6px}
.msg{margin-top:8px;font-size:15px;min-height:1px}.err{color:var(--red)}.ok{color:var(--green)}
.row{border-top:1px solid var(--line);padding:10px 0;word-wrap:break-word;overflow-wrap:anywhere}
.row:first-child{border-top:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bal{font-weight:700}.mute{color:var(--mute);font-size:14px}
.pay{color:var(--green)}.cr{color:var(--red)}
img[data-shot]{max-width:96px;max-height:96px;border-radius:4px;display:block;margin-top:6px;border:1px solid var(--line)}
</style>
</head>
<body>
<h1 id="shop-name">Hisaab</h1>
<div id="app"></div>

<script>
// ---------- data ----------
var KEY = "hisaab-data";
var data = { shop: "My Shop", customers: [], entries: [] };
var view = { page: "home", phone: null, search: "", msg: "", msgType: "" };

// "today" can be forced with ?today=YYYY-MM-DD
var SAMPLE = {"shop":"Lakshmi Provision Store (fictional)","customers":[{"name":"Ravi Kumar","phone":"9000000101"},{"name":"Sunita Devi","phone":"9000000102"},{"name":"Mohd Irfan","phone":"9000000103"},{"name":"Anjali Reddy","phone":"9000000104"},{"name":"Prakash Rao","phone":"9000000105"},{"name":"Fatima Begum","phone":"9000000106"},{"name":"Venkat Naidu","phone":"9000000107"},{"name":"Kavitha S","phone":"9000000108"}],"entries":[{"phone":"9000000101","type":"credit","amount":250,"date":"2026-09-27","note":"groceries"},{"phone":"9000000101","type":"credit","amount":1500,"date":"2026-10-06","note":"groceries"},{"phone":"9000000101","type":"payment","amount":180,"date":"2026-10-10","note":"paid on UPI"},{"phone":"9000000101","type":"credit","amount":420,"date":"2026-10-19","note":"groceries"},{"phone":"9000000101","type":"credit","amount":180,"date":"2026-10-23","note":"groceries"},{"phone":"9000000101","type":"payment","amount":1500,"date":"2026-10-25","note":"paid on UPI"},{"phone":"9000000102","type":"credit","amount":1500,"date":"2026-09-20","note":"groceries"},{"phone":"9000000102","type":"credit","amount":1200,"date":"2026-09-22","note":"groceries"},{"phone":"9000000102","type":"payment","amount":120,"date":"2026-09-25","note":"paid on UPI"},{"phone":"9000000102","type":"credit","amount":340,"date":"2026-09-27","note":"groceries"},{"phone":"9000000102","type":"credit","amount":1500,"date":"2026-10-02","note":"groceries"},{"phone":"9000000102","type":"payment","amount":950,"date":"2026-10-04","note":"paid on UPI"},{"phone":"9000000103","type":"credit","amount":1200,"date":"2026-09-23","note":"groceries"},{"phone":"9000000103","type":"credit","amount":420,"date":"2026-09-28","note":"groceries"},{"phone":"9000000103","type":"payment","amount":120,"date":"2026-10-07","note":"paid on UPI"},{"phone":"9000000103","type":"credit","amount":950,"date":"2026-10-10","note":"groceries"},{"phone":"9000000103","type":"credit","amount":780,"date":"2026-10-16","note":"groceries"},{"phone":"9000000103","type":"payment","amount":420,"date":"2026-10-19","note":"paid on UPI"},{"phone":"9000000104","type":"credit","amount":120,"date":"2026-09-26","note":"groceries"},{"phone":"9000000104","type":"credit","amount":1500,"date":"2026-09-29","note":"groceries"},{"phone":"9000000104","type":"payment","amount":780,"date":"2026-10-02","note":"paid on UPI"},{"phone":"9000000104","type":"credit","amount":420,"date":"2026-10-05","note":"groceries"},{"phone":"9000000105","type":"credit","amount":120,"date":"2026-09-08","note":"groceries"},{"phone":"9000000105","type":"credit","amount":340,"date":"2026-09-13","note":"groceries"},{"phone":"9000000105","type":"payment","amount":230,"date":"2026-09-15","note":"paid on UPI"},{"phone":"9000000106","type":"credit","amount":1500,"date":"2026-09-26","note":"groceries"},{"phone":"9000000106","type":"credit","amount":420,"date":"2026-10-01","note":"groceries"},{"phone":"9000000106","type":"payment","amount":180,"date":"2026-10-08","note":"paid on UPI"},{"phone":"9000000106","type":"credit","amount":560,"date":"2026-10-14","note":"groceries"},{"phone":"9000000106","type":"credit","amount":780,"date":"2026-10-16","note":"groceries"},{"phone":"9000000106","type":"payment","amount":250,"date":"2026-10-19","note":"paid on UPI"},{"phone":"9000000107","type":"credit","amount":950,"date":"2026-10-08","note":"groceries"},{"phone":"9000000107","type":"credit","amount":250,"date":"2026-10-17","note":"groceries"},{"phone":"9000000107","type":"payment","amount":950,"date":"2026-10-22","note":"paid on UPI"},{"phone":"9000000108","type":"credit","amount":780,"date":"2026-09-17","note":"groceries"},{"phone":"9000000108","type":"credit","amount":180,"date":"2026-09-25","note":"groceries"},{"phone":"9000000108","type":"payment","amount":780,"date":"2026-10-03","note":"paid on UPI"},{"phone":"9000000108","type":"credit","amount":120,"date":"2026-10-08","note":"groceries"}]};
var todayParam = new URLSearchParams(location.search).get("today");
var today = /^\d{4}-\d{2}-\d{2}$/.test(todayParam || "") && !isNaN(new Date(todayParam)) ? todayParam : localToday();
function localToday() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var d = JSON.parse(raw);
      if (d && Array.isArray(d.customers) && Array.isArray(d.entries)) data = d;
    }
  } catch (e) { /* start empty */ }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
  catch (e) { return false; }
}

// ---------- helpers ----------
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function rs(n) {
  var s = "Rs " + Math.abs(n).toLocaleString("en-IN");
  if (n < 0) s = "Rs -" + Math.abs(n).toLocaleString("en-IN") + " (advance)";
  return s;
}
// balance = all credit minus all payments, always worked out from entries
function balance(phone) {
  var b = 0;
  data.entries.forEach(function (e) {
    if (e.phone === phone) b += e.type === "credit" ? e.amount : -e.amount;
  });
  return b;
}
function totalOutstanding() {
  var t = 0;
  data.customers.forEach(function (c) { t += balance(c.phone); });
  return t;
}
function remindLink(c) {
  var msg = "Namaste " + c.name + ", your balance at " + data.shop + " is Rs " + balance(c.phone).toLocaleString("en-IN") +
    ". Please pay when you can. Thank you.";
  return "https://wa.me/91" + c.phone + "?text=" + encodeURIComponent(msg);
}
// days since last payment (or first credit if never paid)
function daysSince(phone) {
  var es = data.entries.filter(function (e) { return e.phone === phone; });
  var pays = es.filter(function (e) { return e.type === "payment"; });
  var list = pays.length ? pays : es;
  if (!list.length) return 0;
  var last = list.map(function (e) { return e.date; }).sort().pop();
  if (!pays.length) last = list.map(function (e) { return e.date; }).sort()[0];
  return Math.max(0, Math.round((new Date(today) - new Date(last)) / 86400000));
}
function remindBtn(c) {
  if (balance(c.phone) <= 0) return '<button disabled aria-disabled="true">Nothing due</button>';
  return '<a class="btn wa" data-remind="' + esc(c.phone) + '" href="' + esc(remindLink(c)) + '" target="_blank" rel="noopener">WhatsApp reminder</a>';
}
function safeShot(u) { return typeof u === "string" && /^data:image\/(jpeg|png|webp|gif);base64,/.test(u); }
function say(text, type) { view.msg = text; view.msgType = type || "err"; }
function msgHtml() {
  var h = view.msg ? '<div class="msg ' + view.msgType + '" role="status">' + esc(view.msg) + "</div>" : "";
  view.msg = "";
  return h;
}

// ---------- screens ----------
function render() {
  document.getElementById("shop-name").textContent = data.shop || "Hisaab";
  document.getElementById("app").innerHTML = view.page === "home" ? homeHtml() : customerHtml();
  if (view.page === "home") { var s = document.getElementById("search"); if (s && view.focusSearch) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); view.focusSearch = false; } }
}

function homeHtml() {
  var q = view.search.toLowerCase();
  var list = data.customers.filter(function (c) {
    return !q || c.name.toLowerCase().indexOf(q) > -1 || c.phone.indexOf(q) > -1;
  });
  list = list.slice().sort(function (a, b) { return balance(b.phone) - balance(a.phone); });
  var rows = list.map(function (c) {
    var b = balance(c.phone);
    return '<div class="row" data-customer="' + esc(c.phone) + '">' +
      '<div class="top"><strong>' + esc(c.name) + '</strong><span class="bal" data-balance>' + rs(b) + "</span></div>" +
      '<div class="mute">' + esc(c.phone) + "</div>" +
      '<button onclick="openCustomer(\'' + esc(c.phone) + '\')">Open page</button>' +
      remindBtn(c) + '</div>';
  }).join("") || (data.customers.length ? '<div class="mute">No customer matches your search.</div>' : '<div class="mute">No customers yet. Add one below, or load the sample shop.</div><button onclick="loadSample()">Load sample data</button>');

  // overdue list: customers with a balance, longest since last payment first
  var overdue = data.customers.filter(function (c) { return balance(c.phone) > 0; })
    .map(function (c) { return { c: c, d: daysSince(c.phone), never: !data.entries.some(function (e) { return e.phone === c.phone && e.type === "payment"; }) }; })
    .sort(function (a, b) { return b.d - a.d; })
    .map(function (o) { return "<div class='row'><div class='top'><span>" + esc(o.c.name) + "</span><span class='bal'>" + rs(balance(o.c.phone)) + "</span></div><div class='mute'>" + (o.never ? "No payment yet, " : "Last paid ") + o.d + " days ago</div></div>"; }).join("");

  return '<div class="card"><div class="mute">Total outstanding</div><div class="total" id="total-outstanding">' +
    rs(totalOutstanding()) + "</div></div>" + msgHtml() +
    '<div class="card"><h2>Customers</h2><label for="search">Search name or phone</label>' +
    '<input id="search" value="' + esc(view.search) + '" oninput="onSearch(this.value)">' + rows + "</div>" +
    '<div class="card"><h2>Add customer</h2><label for="c-name">Name</label><input id="c-name" autocomplete="off">' +
    '<label for="c-phone">Phone (10 digits)</label><input id="c-phone" inputmode="numeric" maxlength="10">' +
    '<button onclick="addCustomer()">Add customer</button></div>' +
    (overdue ? '<div class="card"><h2>Overdue (oldest payment first)</h2>' + overdue + "</div>" : '<div class="card"><h2>Overdue</h2><div class="mute">Nobody owes anything right now.</div></div>') +
    '<div class="card"><h2>Import JSON</h2><label for="import-box">Paste data in the sample format</label>' +
    '<textarea id="import-box"></textarea><button id="import-go" onclick="doImport()">Import</button>' +
    '<button class="alt" onclick="loadSample()">Load sample data</button><button class="alt" onclick="exportCsv()">Export CSV</button><button class="danger" onclick="clearAll()">Clear all data</button></div>';
}

function customerHtml() {
  var c = data.customers.filter(function (x) { return x.phone === view.phone; })[0];
  if (!c) { view.page = "home"; return homeHtml(); }
  // newest first: by date, then latest added first
  var es = [];
  data.entries.forEach(function (e, i) { if (e.phone === c.phone) es.push({ e: e, i: i }); });
  es.sort(function (a, b) { return a.e.date < b.e.date ? 1 : a.e.date > b.e.date ? -1 : b.i - a.i; });
  var rows = es.map(function (o) {
    var e = o.e;
    return '<div class="row"><div class="top"><strong class="' + (e.type === "payment" ? "pay" : "cr") + '">' +
      (e.type === "payment" ? "Payment " : "Credit ") + rs(e.amount) + '</strong><span class="mute">' + esc(e.date) + "</span></div>" +
      "<div>" + esc(e.note) + "</div>" +
      (safeShot(e.shot) ? '<img data-shot src="' + esc(e.shot) + '" alt="payment screenshot">' : "") +
      '<button class="alt" onclick="delEntry(' + o.i + ')" aria-label="Delete this entry">Delete</button></div>';
  }).join("") || '<div class="mute">No entries yet.</div>';

  return '<button class="alt" onclick="goHome()">Back</button>' +
    '<div class="card"><h2>' + esc(c.name) + '</h2><div class="mute">' + esc(c.phone) + '</div>' +
    '<div class="total" data-balance>' + rs(balance(c.phone)) + "</div>" +
    remindBtn(c) + '<button class="danger" onclick="delCustomer()">Delete customer</button></div>' + msgHtml() +
    '<div class="card"><h2>Add entry</h2><form id="entry-form" onsubmit="addEntry(event)">' +
    '<label for="e-type">Type</label><select id="e-type"><option value="credit">Credit (shop gave goods)</option><option value="payment">Payment (customer paid)</option></select>' +
    '<label for="e-amt">Amount (Rs)</label><input id="e-amt" type="number" inputmode="decimal" min="0" step="any">' +
    '<label for="e-date">Date</label><input id="e-date" type="date" value="' + esc(today) + '">' +
    '<label for="e-note">Note</label><input id="e-note" maxlength="80">' +
    '<label for="shot-input">Screenshot (optional, for payments)</label><input id="shot-input" type="file" accept="image/*">' +
    '<button type="submit">Save entry</button></form></div>' +
    '<div class="card"><h2>Entries</h2>' + rows + "</div>";
}

// ---------- actions ----------
function onSearch(v) { view.search = v; view.focusSearch = true; render(); }
function openCustomer(p) { view.page = "customer"; view.phone = p; render(); window.scrollTo(0, 0); }
function goHome() { view.page = "home"; render(); }

function addCustomer() {
  var name = document.getElementById("c-name").value.trim();
  var phone = document.getElementById("c-phone").value.trim();
  if (!name) return fail("Please type the customer's name.");
  if (!/^\d{10}$/.test(phone)) return fail("Phone must be exactly 10 digits, numbers only.");
  if (data.customers.some(function (c) { return c.phone === phone; })) return fail("This phone number is already added.");
  data.customers.push({ name: name, phone: phone });
  if (!save()) say("Added, but the browser could not save it (storage full).");
  else say(name + " added.", "ok");
  render();
}
function fail(t) { say(t); render(); }

function addEntry(ev) {
  ev.preventDefault();
  var type = document.getElementById("e-type").value;
  var amt = Number(document.getElementById("e-amt").value);
  var date = document.getElementById("e-date").value || today;
  var note = document.getElementById("e-note").value.trim();
  var file = document.getElementById("shot-input").files[0];
  if (!(amt > 0)) return fail("Amount must be more than 0.");
  var entry = { phone: view.phone, type: type, amount: amt, date: date, note: note };
  function finish() {
    data.entries.push(entry);
    if (!save()) { data.entries.pop(); say("Could not save: browser storage is full. Try a smaller picture."); }
    else say("Entry saved.", "ok");
    render();
  }
  if (file && type === "payment") shrink(file, function (url) { if (url) entry.shot = url; finish(); });
  else finish();
}

// shrink image to max 800px, JPEG 0.7, so storage does not fill up
function shrink(file, cb) {
  var r = new FileReader();
  r.onerror = function () { cb(null); };
  r.onload = function () {
    var img = new Image();
    img.onerror = function () { cb(null); };
    img.onload = function () {
      var k = Math.min(1, 800 / Math.max(img.width, img.height));
      var cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL("image/jpeg", 0.7));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function delEntry(i) {
  if (!confirm("Delete this entry?")) return;
  data.entries.splice(i, 1);
  save(); say("Entry deleted.", "ok"); render();
}

function delCustomer() {
  var c = data.customers.filter(function (x) { return x.phone === view.phone; })[0];
  if (!c || !confirm("Delete " + c.name + " and all their entries?")) return;
  data.customers = data.customers.filter(function (x) { return x.phone !== c.phone; });
  data.entries = data.entries.filter(function (e) { return e.phone !== c.phone; });
  save(); view.page = "home"; say(c.name + " deleted.", "ok"); render();
}
function clearAll() {
  if (!confirm("Erase ALL customers and entries on this phone? Export CSV first if unsure.")) return;
  data = { shop: "My Shop", customers: [], entries: [] };
  save(); view.page = "home"; say("All data cleared.", "ok"); render();
}
function loadSample() {
  if (data.customers.length && !confirm("This replaces your current data with the sample shop. Continue?")) return;
  data = JSON.parse(JSON.stringify(SAMPLE));
  var ok = save();
  view.page = "home"; view.search = "";
  say("Sample shop loaded: " + data.customers.length + " customers, " + data.entries.length + " entries." + (ok ? "" : " (Could not save to browser.)"), ok ? "ok" : "err");
  render();
}
function doImport() {
  var txt = document.getElementById("import-box").value;
  var d;
  if (!txt.trim()) return fail("Paste your JSON into the box first.");
  try { d = JSON.parse(txt); } catch (e) { return fail("That is not valid JSON. Check the pasted text."); }
  if (!d || !Array.isArray(d.customers)) return fail("JSON needs a \"customers\" list.");
  var custs = [], seen = {};
  d.customers.forEach(function (c) {
    if (!c) return;
    var p = String(c.phone == null ? "" : c.phone).trim();
    if (!/^\d{10}$/.test(p) || seen[p]) return;
    seen[p] = 1; custs.push({ name: String(c.name || p), phone: p });
  });
  var ents = [], skipped = 0;
  (Array.isArray(d.entries) ? d.entries : []).forEach(function (e) {
    var p = e && String(e.phone == null ? "" : e.phone).trim();
    var a = e && Number(e.amount);
    if (!e || !seen[p] || !(a > 0) || (e.type !== "credit" && e.type !== "payment")) { skipped++; return; }
    var dt = /^\d{4}-\d{2}-\d{2}$/.test(String(e.date)) ? String(e.date) : today;
    var o = { phone: p, type: e.type, amount: a, date: dt, note: String(e.note || "") };
    if (safeShot(e.shot)) o.shot = e.shot;
    ents.push(o);
  });
  if (!custs.length) return fail("No valid customers found. Each needs a 10-digit phone.");
  if (data.customers.length && !confirm("Importing replaces your current data. Continue?")) return;
  data = { shop: String(d.shop || "My Shop"), customers: custs, entries: ents };
  var ok = save();
  say("Imported " + custs.length + " customers and " + ents.length + " entries" +
    (skipped ? " (" + skipped + " entries skipped)" : "") + (ok ? "." : ". Could not save to the browser."), ok ? "ok" : "err");
  view.page = "home"; render();
}

function exportCsv() {
  var lines = ["name,phone,type,amount,date,note"];
  data.entries.forEach(function (e) {
    var c = data.customers.filter(function (x) { return x.phone === e.phone; })[0];
    lines.push([c ? c.name : "", e.phone, e.type, e.amount, e.date, e.note].map(function (v) {
      return '"' + String(v).replace(/"/g, '""') + '"';
    }).join(","));
  });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = "hisaab.csv"; a.click();
}

load();
render();
</script>
</body>
</html>
